name: Deploy Docs

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Format code
        run: forge fmt

      - name: Generate docs
        run: make doc

      - name: Verify docs structure
        run: |
          echo "Checking docs directory structure:"
          ls -la docs/
          echo "Checking book directory:"
          ls -la docs/book/
          echo "HTML files found:"
          find docs/book/ -name "*.html" | head -5

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          force_orphan: true
